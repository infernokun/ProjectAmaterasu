worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" "$http_ssl_client_s_dn_cn" ';
                    
    # Skip the container's own health probe so it does not flood the access log
    map "$remote_addr:$request_uri" $log_request {
        default                   1;
        "~^127\.0\.0\.1:/health$" 0;
        "~^::1:/health$"          0;
    }
    access_log /var/log/nginx/access.log main if=$log_request;

    # Keep the scheme from a TLS proxy in front of this one, so the API marks cookies Secure
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    # The port the browser used (from a proxy in front, else the Host header). Without it the API
    # assumes 80 or 443 and same-origin requests on another port look cross-origin.
    map "$http_x_forwarded_port:$http_host" $forwarded_port {
        "~^(?<upstream>[0-9]+):"   $upstream;
        "~^:.*:(?<hostport>[0-9]+)$" $hostport;
        default                    "";
    }

    server_tokens off;

    # Compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        include /etc/nginx/security-headers.conf;

        # Health Check Endpoint
        location = /health {
          default_type application/json;
          return 200 '{"success": {"status_code": 200, "status": "OK"}}';
        }

        # Serve Static Files
        location = / {
          index index.html;
        }

        location / {
          try_files $uri $uri/ /index.html;
        }

        # API Proxy
        location /api/ {
          proxy_pass http://amaterasu-rest:8080/amaterasu-rest/api/;
          proxy_read_timeout 1800s;
          proxy_send_timeout 1800s;
          proxy_set_header Host $http_host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $forwarded_proto;
          proxy_set_header X-Forwarded-Port $forwarded_port;
          # The API scopes the refresh cookie to its own path; the browser sees it under /api/
          proxy_cookie_path /amaterasu-rest/api/ /api/;
          # CORS is handled by the API (ALLOWED_ORIGINS)
        }

        # Live updates; the access token is in the query string, so keep it out of the access log
        location /socket-handler/ {
          proxy_pass http://amaterasu-rest:8080/amaterasu-rest/socket-handler/;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
          proxy_set_header Host $http_host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $forwarded_proto;
          proxy_set_header X-Forwarded-Port $forwarded_port;
          proxy_read_timeout 1h;
          access_log off;
        }

        # Error Handling
        error_page 500 502 503 504 /50x.html;
        client_max_body_size 100M;
        underscores_in_headers on;
    }
}
