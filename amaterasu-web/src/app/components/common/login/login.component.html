<form class="modal" [formGroup]="form" (ngSubmit)="submit()" aria-labelledby="login-title" novalidate>
  <div class="row between">
    <h2 class="h2" id="login-title">Sign in</h2>
    <button type="button" class="iconbtn" aria-label="Close" (click)="close()"><app-icon name="close" /></button>
  </div>

  @if (data?.notice) {
    <div class="banner ok"><app-icon name="check" /><div>{{ data?.notice }}</div></div>
  }

  <label class="field">
    <span class="label">Username</span>
    <input class="input" formControlName="username" autocomplete="username" autocapitalize="none" spellcheck="false"
           [class.err]="invalid('username')" [attr.aria-invalid]="invalid('username')">
    @if (invalid('username')) {
      <span class="help err-text">Enter your username</span>
    }
  </label>

  <div class="field">
    <label class="label" for="login-password">Password</label>
    <div class="affix">
      <input id="login-password" [type]="showPassword() ? 'text' : 'password'" formControlName="password"
             autocomplete="current-password" [attr.aria-invalid]="invalid('password')">
      <button type="button" class="reveal" (click)="showPassword.set(!showPassword())"
              [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'" [attr.aria-pressed]="showPassword()">
        <app-icon name="eye" size="sm" />
      </button>
    </div>
    @if (invalid('password')) {
      <span class="help err-text">Enter your password</span>
    }
  </div>

  <label class="check">
    <input type="checkbox" formControlName="remember">
    <span>Remember my username on this browser</span>
  </label>

  @if (error()) {
    <div class="banner bad" role="alert"><app-icon name="alert" /><div>{{ error() }}</div></div>
  }

  <button type="submit" class="btn primary block" [disabled]="busy()">
    @if (busy()) {
      <app-icon name="spinner" size="sm" [spin]="true" />Signing in
    } @else {
      Sign in
    }
  </button>

  <p class="small muted switch">No account yet? <button type="button" class="linkbtn" (click)="register()">Create one</button></p>
</form>
