<div class="editor-container">
  <div class="header">
    @if (placeholder()) {
      <span class="tip">{{ placeholder() }}</span>
    }
    <button type="button" class="btn ghost sm" (click)="copyToClipboard()">
      <app-icon name="copy" size="sm" />
      Copy to clipboard
    </button>
    @if (copied()) {
      <p class="copied-status"><app-icon name="check" size="sm" /> Copied</p>
    }
  </div>

  <amaterasu-monaco-editor [theme]="theme()" [codeModel]="codeModel()" [readOnly]="readonly()" [options]="options"
    (valueChanged)="onCodeChanged($event)" />
</div>
