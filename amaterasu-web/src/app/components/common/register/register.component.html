<form class="modal" [formGroup]="form" (ngSubmit)="submit()" aria-labelledby="register-title" novalidate>
  <div class="row between">
    <h2 class="h2" id="register-title">Create an account</h2>
    <button type="button" class="iconbtn" aria-label="Close" (click)="close()"><app-icon name="close" /></button>
  </div>
  <p class="dim intro">An admin adds you to a team once your account exists.</p>

  <label class="field">
    <span class="label">Username</span>
    <input class="input" formControlName="username" autocomplete="username" autocapitalize="none" spellcheck="false"
           [class.err]="invalid('username')" [attr.aria-invalid]="invalid('username')">
    @if (invalid('username')) {
      <span class="help err-text">{{ usernameError() }}</span>
    } @else {
      <span class="help">3 to 32 letters, numbers, dots, dashes or underscores</span>
    }
  </label>

  <label class="field">
    <span class="label">Password</span>
    <input class="input" type="password" formControlName="password" autocomplete="new-password"
           [class.err]="invalid('password')" [attr.aria-invalid]="invalid('password')" aria-describedby="password-rules">
  </label>
  <ul class="rules" id="password-rules" aria-label="Password rules">
    @for (rule of rules(); track rule.text) {
      <li [class.met]="rule.met">
        <app-icon [name]="rule.met ? 'check' : 'close'" size="sm" />
        <span>{{ rule.text }}</span>
        <span class="visually-hidden">{{ rule.met ? 'done' : 'not yet' }}</span>
      </li>
    }
  </ul>

  <label class="field">
    <span class="label">Confirm password</span>
    <input class="input" type="password" formControlName="confirmPassword" autocomplete="new-password"
           [class.err]="(invalid('confirmPassword') || form.hasError('passwordMismatch')) && form.controls.confirmPassword.touched">
    @if (form.hasError('passwordMismatch') && form.controls.confirmPassword.touched) {
      <span class="help err-text">The passwords do not match</span>
    }
  </label>

  @if (error()) {
    <div class="banner bad" role="alert"><app-icon name="alert" /><div>{{ error() }}</div></div>
  }

  <button type="submit" class="btn primary block" [disabled]="busy()">
    @if (busy()) {
      <app-icon name="spinner" size="sm" [spin]="true" />Creating account
    } @else {
      Create account
    }
  </button>

  <p class="small muted switch">Already have an account? <button type="button" class="linkbtn" (click)="signIn()">Sign in</button></p>
</form>
