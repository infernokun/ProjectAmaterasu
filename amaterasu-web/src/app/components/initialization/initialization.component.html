<main class="setup">
  <form class="card stack loose" [formGroup]="form" (ngSubmit)="submit()" aria-labelledby="setup-title" novalidate>
    <div class="brand">
      <div class="brand-mark"><app-icon name="brand" /></div>
      <div>
        <div class="brand-name">Amaterasu</div>
        <div class="brand-sub">Labs and CTF</div>
      </div>
    </div>
    <div class="stack tight">
      <h1 class="h1" id="setup-title">Set up Amaterasu</h1>
      <p class="sub">Name this installation. Everyone sees the name and description on the sign in page.</p>
    </div>

    <label class="field">
      <span class="label">Name</span>
      <input class="input" formControlName="name" placeholder="Winter Range 2026" [class.err]="nameMissing()" [attr.aria-invalid]="nameMissing()">
      @if (nameMissing()) {
        <span class="help err-text">Give the installation a name</span>
      }
    </label>

    <label class="field">
      <span class="label">Description</span>
      <input class="input" formControlName="description" placeholder="Labs and challenges for the winter cohort">
      <span class="help">Optional</span>
    </label>

    @if (error()) {
      <div class="banner bad" role="alert"><app-icon name="alert" /><div>{{ error() }}</div></div>
    }

    <button type="submit" class="btn primary block" [disabled]="busy()">
      @if (busy()) {
        <app-icon name="spinner" size="sm" [spin]="true" />Saving
      } @else {
        Finish setup
      }
    </button>
  </form>
</main>
