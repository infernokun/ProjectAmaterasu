@if (banner().value !== 'NONE') {
  <div class="classification" role="note" [style.background]="banner().background" [style.color]="banner().color">{{ banner().label }}</div>
}
<div class="app-body">
  @if (!ready()) {
    <div class="booting" role="status">
      <app-icon name="spinner" [spin]="true" />
      <span class="loading-text">Loading</span>
    </div>
  }
  <router-outlet />
</div>
@if (banner().value !== 'NONE') {
  <div class="classification" role="note" [style.background]="banner().background" [style.color]="banner().color">{{ banner().label }}</div>
}
