name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rest:
    name: amaterasu-rest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: amaterasu-rest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test
        run: ./gradlew build --no-daemon
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rest-test-reports
          path: amaterasu-rest/build/reports/tests

  web:
    name: amaterasu-web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: amaterasu-web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: amaterasu-web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build:prod
      - name: Test
        run: pnpm exec ng test --watch=false --browsers=ChromeHeadlessCI

  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.7"
          python-version: "3.14"
      - name: Lockfiles match requirements.in
        run: |
          for r in amaterasu-proxmox/requirements amaterasu-populate/requirements requirements-dev; do
            uv pip compile --quiet --universal --generate-hashes --python-version 3.14 $r.in -o $r.txt
          done
          git diff --exit-code -- '*requirements*.txt'
      - name: Install
        run: |
          uv venv
          uv pip install --require-hashes -r requirements-dev.txt -r amaterasu-proxmox/requirements.txt -r amaterasu-populate/requirements.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Lint
        run: ruff check .
      - name: Smoke test
        run: python amaterasu-proxmox/main.py

  docker:
    name: docker images
    runs-on: ubuntu-latest
    needs: [rest, web]
    strategy:
      fail-fast: false
      matrix:
        image: [amaterasu-rest, amaterasu-web, amaterasu-proxmox]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image }}
          push: false
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
