app:
  version: test

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 6000
      repositories:
        enabled: false

amaterasu:
  applicationName: "Amaterasu"
  defaultAdminUsername: test_admin
  defaultAdminPassword: test_password
  uploadDir: "${java.io.tmpdir}/amaterasu-test"
  encryptionKey: "test-encryption-key"
  sshPort: 22
  chatSocket: ""

rsa:
  private-key: "${java.io.tmpdir}/amaterasu-test/private.pem"
  public-key: "${java.io.tmpdir}/amaterasu-test/public.pem"
