management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
      roles: ADMIN
      livenessState:
        enabled: true
      readinessState:
        enabled: true
  info:
    env:
      enabled: true

spring:
  task:
    scheduling:
      pool:
        size: 4
  datasource:
    url: jdbc:postgresql://${DB_IP:localhost}:${DB_PORT:5432}/${DB_NAME:amaterasu}
    username: ${DB_USER:amaterasu}
    password: ${DB_PASS:amaterasu}
  jpa:
    hibernate:
      ddl-auto: update 
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:amaterasu}
      timeout: 6000

server:
  forward-headers-strategy: native
  port: 8080
  servlet:
    contextPath: /amaterasu-rest
  shutdown: graceful
  # The client address comes from X-Forwarded-For only when the request arrives from a private
  # address (the nginx container), so callers cannot spoof it
  tomcat:
    remoteip:
      remote-ip-header: x-forwarded-for
      protocol-header: x-forwarded-proto
      port-header: x-forwarded-port

amaterasu:
  applicationName: "Amaterasu"
  defaultAdminUsername: amaterasu_admin
  # Blank generates a random password, logged once when the admin account is created
  defaultAdminPassword: "${ADMIN_PASSWORD:}"
  allowedOrigins: "${ALLOWED_ORIGINS:}"
  uploadDir: "${DOCKER_COMPOSE_PATH:/var/tmp/amaterasu}"
  encryptionKey: "${ENCRYPTION_KEY}"
  sshPort: "${SSH_PORT:22}"
  chatSocket: ""

logging:
  level:
    org.hibernate: WARN
    org.hibernate.orm.connections.pooling: ERROR

rsa:
  private-key: ${RSA_PRIVATE_KEY_PATH:certs/private.pem}
  public-key: ${RSA_PUBLIC_KEY_PATH:certs/public.pem}