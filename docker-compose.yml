services:
  amaterasu-web:
    image: ${REGISTRY:-docker.io}/${NAMESPACE:-infernokun}/amaterasu-web:${TAG:-latest}
    #build: ./amaterasu-web
    restart: always
    environment:
      - BASE_URL=http://amaterasu-web
      - REST_URL=/api
    ports:
      - "${WEB_PORT:-8764}:80"
    volumes:
      - amaterasu-web:/var/log/nginx
    depends_on:
      amaterasu-rest:
        condition: service_healthy

  amaterasu-db:
    image: postgres:17.11
    restart: always
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-amaterasu}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-amaterasu}"
      POSTGRES_DB: "${POSTGRES_DB:-amaterasu}"
    volumes:
      - amaterasu-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-amaterasu}"]
      interval: 10s
      timeout: 5s
      retries: 5

  amaterasu-redis:
    image: redis:8.8
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-amaterasu}"]
    volumes:
      - amaterasu-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-amaterasu}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  amaterasu-rest:
    image: ${REGISTRY:-docker.io}/${NAMESPACE:-infernokun}/amaterasu-rest:${TAG:-latest}
    #build: ./amaterasu-rest
    restart: always
    ports:
      # Loopback only: the API has no authentication yet, and nginx reaches it over the network
      - "${REST_BIND:-127.0.0.1}:${REST_PORT:-8765}:8080"
    environment:
      TZ: "UTC"
      DOCKER_COMPOSE_PATH: "${DOCKER_COMPOSE_PATH:-/var/tmp/amaterasu}"
      DB_IP: "${POSTGRES_IP:-amaterasu-db}"
      DB_NAME: "${POSTGRES_DB:-amaterasu}"
      DB_USER: "${POSTGRES_USER:-amaterasu}"
      DB_PASS: "${POSTGRES_PASSWORD:-amaterasu}"
      DB_PORT: "${DB_PORT:-5432}"
      REDIS_HOST: "${REDIS_HOST:-amaterasu-redis}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-amaterasu}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:-secret_key}"
      RSA_PRIVATE_KEY_PATH: "${RSA_PRIVATE_KEY_PATH:-/var/tmp/amaterasu/private.pem}"
      RSA_PUBLIC_KEY_PATH: "${RSA_PUBLIC_KEY_PATH:-/var/tmp/amaterasu/public.pem}"
    volumes:
      - amaterasu-rest:/var/tmp/amaterasu
    depends_on:
      amaterasu-db:
        condition: service_healthy
      amaterasu-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/amaterasu-rest/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  amaterasu-db:
    driver: local
  amaterasu-web:
  amaterasu-redis:
  amaterasu-rest:
